name: QingQi
options:
  deploymentTarget:
    iOS: "26.0"
packages:
  QingQiCore:
    path: Core
targets:
  QingQi:
    type: application
    platform: iOS
    sources:
      - path: QingQiApp
    dependencies:
      - package: QingQiCore
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.example.qingqi
      SWIFT_VERSION: 6.0
      GENERATE_INFOPLIST_FILE: YES
      MARKETING_VERSION: 0.1.0
      CURRENT_PROJECT_VERSION: 1
      TARGETED_DEVICE_FAMILY: "1"
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_CFBundleDisplayName: QingQi
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      CODE_SIGN_ENTITLEMENTS: QingQiApp/QingQi.entitlements
  QingQiURLFilterExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: QingQiURLFilterExtension
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.example.qingqi.urlfilter
      SWIFT_VERSION: 6.0
      INFOPLIST_FILE: QingQiURLFilterExtension/Info.plist
      CODE_SIGN_ENTITLEMENTS: QingQiURLFilterExtension/QingQiURLFilterExtension.entitlements
      TARGETED_DEVICE_FAMILY: "1"
  QingQiMessageFilterExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: QingQiMessageFilterExtension
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.example.qingqi.messagefilter
      SWIFT_VERSION: 6.0
      INFOPLIST_FILE: QingQiMessageFilterExtension/Info.plist
      TARGETED_DEVICE_FAMILY: "1"
  QingQiCallDirectoryExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: QingQiCallDirectoryExtension
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.example.qingqi.calldirectory
      SWIFT_VERSION: 6.0
      INFOPLIST_FILE: QingQiCallDirectoryExtension/Info.plist
      TARGETED_DEVICE_FAMILY: "1"
